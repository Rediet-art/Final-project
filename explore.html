<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Explore</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="app-body">

  <div class="explore-container">

  <h2>🔍 Explore</h2>
  <p class="subtitle">Discover fun topics to learn</p>

  <div class="topics">

    <div class="topic-card" onclick="selectTopic('How space works')">
      🚀 How space works
    </div>

    <div class="topic-card" onclick="selectTopic('How animals think')">
      🐾 How animals think
    </div>

    <div class="topic-card" onclick="selectTopic('How machines work')">
      ⚙️ How machines work
    </div>

    <div class="topic-card" onclick="selectTopic('How oceans move')">
      🌊 How oceans move
    </div>

  </div>

</div>

<script>
  function selectTopic(topic) {
    alert("You selected: " + topic);
    localStorage.setItem("selectedTopic", topic);
    window.location.href = "dashboard.html";

  }
</script>
</body>
</html>
