<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voice Input</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar">
  <a class="logo" href="dashboard.html">
    <img src="Images/logo.png" alt="Nao5 AI Learn logo" class="logo-img">
    <span>Nao5 AI Learn</span>
  </a>

  <ul class="nav-links">
    <li><a href="dashboard.html">Home</a></li>
    <li><a href="history.html">History</a></li>
    <li><a href="voice.html">Voice</a></li>
    <li><a href="explore.html">Explore</a></li>
    <li><a href="profile.html">Profile</a></li>
  </ul>

  <a class="nav-user" href="profile.html">
    <i class="fas fa-user-circle"></i>
    <span id="navUsername">Guest</span>
  </a>

  <div class="auth-buttons" id="authButtons">
    <a href="login.html" class="nav-btn">Login</a>
    <a href="signup.html" class="nav-btn signup">Sign Up</a>
  </div>
</nav>

  <div class="voice-container">

  <h2>🎤 Voice Input</h2>
  <p class="subtitle">Tap the microphone and ask your question</p>

  <!-- MIC BUTTON -->
  <button id="startVoiceBtn" class="mic-btn">🎤 Speak</button>

  <p id="status" class="status-text">Tap to speak</p>

  <!-- INPUT BOX -->
  <textarea id="questionInput" placeholder="Your question will appear here..."></textarea>

  <!-- RESULT -->
  <div id="voiceResultBox" class="result-box"></div>

  <!-- ACTION BUTTONS -->
  <div class="voice-actions">
    <button onclick="sendVoiceQuestion()" class="primary-btn">Continue</button>
    <button onclick="speakText(document.getElementById('voiceResultBox').innerText)" class="secondary-btn">
      🔊 Replay
      </button><button onclick="resetVoice()" class="refresh-btn">🔄 New Question</button>
    </div>

</div>
    

<script>
    if (localStorage.getItem("parentalConsent") !== "true") {
      window.location.replace("consent.html");
    }

    function showLoggedInUser() {
      const loggedInName = localStorage.getItem("loggedInName");
      const loggedInUser = localStorage.getItem("loggedInUser");
      const navUsername = document.getElementById("navUsername");
      const authButtons = document.getElementById("authButtons");

      if (loggedInUser) {
        navUsername.innerText = loggedInName || loggedInUser;
        authButtons.style.display = "none";
      } else {
        navUsername.innerText = "Guest";
        authButtons.style.display = "flex";
      }
    }

    window.onload = showLoggedInUser;

    // Check if the browser supports Speech Recognition
    window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    const recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.continuous = true; // Keep listening until user stops
    recognition.interimResults = true;  // Show results even while still speaking
    recognition.maxAlternatives = 1;

    const startBtn = document.getElementById("startVoiceBtn");
    const statusText = document.getElementById("status");
    const questionInput = document.getElementById("questionInput");

    // When button is clicked → start listening
    startBtn.addEventListener("click", () => {
        recognition.start();
        statusText.innerText = "Listening… speak now!";
    });

    // When speech is captured
    recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        questionInput.value = text;
        statusText.innerText = "Voice captured!";
    };

    // If the user stops talking
    recognition.onspeechend = () => {
        recognition.stop();
        statusText.innerText = "Processing voice…";
    };

    // Errors (e.g., microphone blocked)
    recognition.onerror = (event) => {
       statusText.innerText = "Error: " + event.error;
    };

      function speakText(text) {
        window.speechSynthesis.cancel(); // stop previous speech
        const cleanText = text
          .replace(/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu, "")
          .replace(/[^\w\s.,!?'"()-]/g, "")
          .replace(/\s+/g, " ")
          .trim();

        const speech = new SpeechSynthesisUtterance(cleanText);

        speech.rate = 0.85; // slower for kids
        speech.pitch = 1.1;

        window.speechSynthesis.speak(speech);
      }
      async function sendVoiceQuestion() {
        const question = document.getElementById("questionInput").value.trim();
        const resultBox = document.getElementById("voiceResultBox");

           if (!question) {
          alert("Please say something first.");
    return;
  }

  resultBox.innerText = "Let me think about it...";

  try {
    const response = await fetch("/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        question: question,
        level: "5-8" // Voice input defaults to 5-8 for simplicity, can be enhanced later to ask user for level
      })
    });

    const data = await response.json();

    resultBox.innerText = data.explanation;
    // save to history
    saveToHistory(question, data.explanation);

    console.log("Voice history saved");
    
    // SPEAK RESULT
    speakText(data.explanation);

  } catch (error) {
    console.error(error);
    resultBox.innerText = "Error getting explanation.";
  }
}
function resetVoice() {
  // Clear input
  document.getElementById("questionInput").value = "";

  // Clear result
  document.getElementById("voiceResultBox").innerText = "";

  // Reset status text
  document.getElementById("status").innerText = "Tap to speak";

  // Stop any ongoing speech
  window.speechSynthesis.cancel();

  console.log("Voice reset");
}

  function saveToHistory(question, explanation) {

  const user =
    localStorage.getItem("loggedInUser") || "guest";

  const historyKey = "history_" + user;

  const history =
    JSON.parse(localStorage.getItem(historyKey)) || [];

  history.push({
    question,
    explanation,
    date: new Date().toLocaleString()
  });

  localStorage.setItem(
    historyKey,
    JSON.stringify(history)
  );
   
}
</script>
 


  </div>

</body>
</html>
