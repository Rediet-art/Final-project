<!-- ===== MAIN CONTENT ===== -->
<div class="dashboard-container">

  <h1 class="title">
    Understand Anything.<br>
    <span>Explained Simply</span>
  </h1>

  <p class="subtitle">
    Turn complex ideas into easy explanations anyone can understand.
  </p>

  <!-- ===== INPUT CARD ===== -->
  <div class="card">

    <textarea id="questionInput" placeholder="Ask a question..."></textarea>

    <div class="controls">

      <div>
        <label>Age Level</label>
        <select id="level">
          <option value="5-8">Ages 5–8</option>
          <option value="8-12">Ages 8–12</option>
        </select>
      </div>

      <div>
        <label>Tone</label>
        <select id="tone">
          <option value="simple">Simple</option>
          <option value="playful">Playful</option>
        </select>
      </div>

    </div>

    <div class="buttons">
      <button class="voice-btn" onclick="window.location.href='voice.html'">🎤 Voice</button>
      <button class="generate-btn" onclick="generateExplanation()">Explain</button>
    </div>

  </div>

  <!-- RESULT -->
  <div id="resultBox"></div>

</div>

<!-- ===== SCRIPT ===== -->
<script>
async function generateExplanation() {
  const question = document.getElementById("questionInput").value.trim();
  const resultBox = document.getElementById("resultBox");
  const level = document.getElementById("level").value;

  if (!question) {
    alert("Please enter a question.");
    return;
  }

  resultBox.innerText = " Thinking...";

  try {
    const response = await fetch("http://localhost:3000/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ question, level })
    });

    const data = await response.json();

    resultBox.innerText = data.explanation;

    // Save history
    saveToHistory(question, data.explanation);

  } catch (error) {
    console.error(error);
    resultBox.innerText = "Error generating response.";
  }
}

function saveToHistory(question, explanation) {
  const user = localStorage.getItem("loggedInUser");
  if (!user) return;

  const historyKey = "history_" + user;
  let history = JSON.parse(localStorage.getItem(historyKey)) || [];

  history.push({
    question,
    explanation,
    date: new Date().toLocaleString()
  });

  localStorage.setItem(historyKey, JSON.stringify(history));
}

window.onload = () => {
  const topic = localStorage.getItem("selectedTopic");

  if (topic) {
    document.getElementById("questionInput").value = topic;
    localStorage.removeItem("selectedTopic");
  }
};
</script>
