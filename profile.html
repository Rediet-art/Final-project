<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar">
  <a class="logo" href="dashboard.html">
    <img src="Images/logo.png" alt="Nao5 AI Learn logo" class="logo-img">
    <span>Nao5 AI Learn</span>
  </a>

   <ul class="nav-links">
    <li><a href="dashboard.html">Home</a></li>
    <li><a href="history.html">History</a></li>
    <li><a href="voice.html">Voice</a></li>
    <li><a href="explore.html">Explore</a></li>
    <li><a href="profile.html">Profile</a></li>
  </ul>

  <a class="nav-user" href="profile.html">
    <i class="fas fa-user-circle"></i>
    <span id="navUsername">Guest</span>
  </a>

  <div class="auth-buttons" id="authButtons">
    <a href="login.html" class="nav-btn">Login</a>
    <a href="signup.html" class="nav-btn signup">Sign Up</a>
  </div>
</nav>

<div class="profile-container">

  <h2>👤 User Profile</h2>

  <div class="profile-card">

 
    <p><strong>Name:</strong> <span id="profileName"></span></p>

    <p><strong>Email:</strong> <span id="profileEmail"></span></p>
<p>
  <strong>Last Login:</strong>
  <span id="lastLogin"></span>
<div class="edit-section">

  <input type="text" id="editName" placeholder="New Name">

  <input type="email" id="editEmail" placeholder="New Email">

  <button onclick="saveProfile()" class="save-btn">
    Save Changes
  </button>

</div></p>
    <button onclick="logout()" class="logout-btn">
      Logout
    </button><button onclick="toggleDarkMode()" class="dark-btn">
  🌙 Dark Mode
</button><button onclick="editProfile()" class="edit-btn">
  ✏ Edit Profile
</button>
  </div>
</div>

<script>
  if (localStorage.getItem("parentalConsent") !== "true") {
    window.location.replace("consent.html");
  }

  function showLoggedInUser() {
    const loggedInName = localStorage.getItem("loggedInName");
    const loggedInUser = localStorage.getItem("loggedInUser");
    const navUsername = document.getElementById("navUsername");
    const authButtons = document.getElementById("authButtons");

    if (loggedInUser) {
      navUsername.innerText = loggedInName || loggedInUser;
      authButtons.style.display = "none";
    } else {
      navUsername.innerText = "Guest";
      authButtons.style.display = "flex";
    }
  }

  document.getElementById("profileName").innerText =
    localStorage.getItem("loggedInName") || "Unknown User";

  document.getElementById("profileEmail").innerText =
    localStorage.getItem("loggedInUser") || "No Email";

  function logout() {
    localStorage.removeItem("loggedInUser");
    localStorage.removeItem("loggedInName");

    window.location.href = "login.html";
  }function toggleDarkMode() {
  document.body.classList.toggle("dark-mode");
}function editProfile() {

  const editSection =
    document.querySelector(".edit-section");

  // Toggle visibility
  if (editSection.style.display === "block") {

    editSection.style.display = "none";

  } else {

    editSection.style.display = "block";

    // Autofill current values
    document.getElementById("editName").value =
      localStorage.getItem("loggedInName")|| "";

    document.getElementById("editEmail").value =
      localStorage.getItem("loggedInUser")|| "";

  }
}

function saveProfile() {

  const newName =
    document.getElementById("editName").value.trim();

  const newEmail =
    document.getElementById("editEmail").value.trim();

  if (!newName || !newEmail) {
    alert("Please fill all fields.");
    return;
  }

  // Update localStorage
  localStorage.setItem("loggedInName", newName);
  localStorage.setItem("loggedInUser", newEmail);

  localStorage.setItem("fullName", newName);
  localStorage.setItem("userEmail", newEmail);

  // Update displayed profile
  document.getElementById("profileName").innerText =
    newName;

  document.getElementById("profileEmail").innerText =
    newEmail;

  alert("✅ Profile updated successfully!");

}
localStorage.setItem(
  "lastLogin",
  new Date().toLocaleString()
);
document.getElementById("lastLogin").innerText = localStorage.getItem("lastLogin");


function toggleDarkMode() {

  document.body.classList.toggle("dark-mode");

  if (document.body.classList.contains("dark-mode")) {
    localStorage.setItem("theme", "dark");
  } else {
    localStorage.setItem("theme", "light");
  }
}


/* Keep dark mode after refresh */
window.onload = () => {
  showLoggedInUser();

  if (localStorage.getItem("theme") === "dark") {
    document.body.classList.add("dark-mode");
  }

};
</script>

</body>
</html>
