<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body class="app-body">

  <div class="app-container">

    <!-- Header -->
    <div class="top-bar">
      <h3>Profile</h3>
    </div>

    <!-- Profile Card -->
    <div class="profile-card">
      <div class="profile-avatar">👧</div>
      <h4>Guest User</h4>
      <p>Learning Explorer</p>
    </div>

    

  <div class="emoji-bubble">👤</div>

  <h2>Your Profile</h2>

  <p id="userEmailDisplay"></p>

  <div class="profile-buttons">

    <button class="btn primary full-btn" onclick="openSettings()">
      ⚙️ Settings
    </button>

    <button class="btn secondary full-btn" onclick="openPrivacy()">
      🔒 Privacy
    </button>

    <button class="btn danger full-btn" onclick="logoutUser()">
      🚪 Logout
    </button>
    

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
      <a href="dashboard.html" class="nav-item">🏠<span>Home</span></a>
      <a href="explore.html" class="nav-item">🔍<span>Explore</span></a>
      <a href="profile.html" class="nav-item active">👤<span>Profile</span></a>
      <a href="logout.html" class="nav-item">🚪<span>Logout</span></a>
      <a href="history.html" class="nav-item">📚<span>History</span></a>
    
    </div>

  </div>
<script>
  // Display logged in user
  const user = localStorage.getItem("loggedInUser");
  document.getElementById("userEmailDisplay").innerText =
    "Logged in as: " + user;

  function openSettings() {
    alert("Settings page coming soon.");
  }

  function openPrivacy() {
    alert("Privacy policy page coming soon.");
  }

  function logoutUser() {
    localStorage.removeItem("loggedInUser");
    window.location.href = "login.html";
  }
</script>

</body>
</html>
