<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Generate Explanation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body class="app-body">

<!-- Consent protection -->
<script>
  if (localStorage.getItem("parentalConsent") !== "true") {
    window.location.replace("consent.html");
  }
 
async function generateExplanation() {
  const question = document.getElementById("questionInput").value.trim();
  const resultBox = document.getElementById("resultBox");

  if (!question) {
    alert("Please enter a question.");
    return;
  }

  resultBox.innerText = "🤖 Thinking...";

  try {
    const response = await fetch("http://localhost:3000/generate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        question: question,
        level: document.getElementById("level")?.value || "8-12"
      })
    });

    const data = await response.json();

    console.log("Generate response:", data);

    resultBox.innerText = data.explanation;

    // ✅ THIS IS WHAT SAVES HISTORY
    saveToHistory(question, data.explanation);

  } catch (error) {
    console.error("Error:", error);
    resultBox.innerText = "Error generating response.";
  }
}

function saveToHistory(question, explanation) {
  const user = localStorage.getItem("loggedInUser");

  if (!user) {
    console.log("No logged in user ❌");
    return;
  }

  const historyKey = "history_" + user;

  let history = JSON.parse(localStorage.getItem(historyKey)) || [];

  history.push({
    question,
    explanation,
    date: new Date().toLocaleString()
  });

  localStorage.setItem(historyKey, JSON.stringify(history));

  console.log("Saved history:", history);
}
</script>


<div class="app-container">

  <label for="level">Choose age group:</label>

<select id="level">
  <option value="5-8">Ages 5–8</option>
  <option value="8-12">Ages 8–12</option>
</select>
   
  <h2>Ask a Question</h2>
  <p>Type your question below.</p>

  <!-- Input -->
  <textarea id="questionInput" placeholder="Ask a question..."></textarea>

  <!-- Button -->
  <button onclick="generateExplanation()">Generate Explanation</button>

  <!-- Status -->
  <p id="statusText"></p>

  <!-- Output -->
  <div id="resultBox"></div>

</div>


 <script src="generate.js"></script>

 

</body>
</html>
