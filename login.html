<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
</head>
<body class="app-body">
  
  <div class="auth-container">

  <h2>😊 Welcome Back</h2>
  <p class="subtitle">Login to continue</p>

  <form class="auth-form">

    <div class="form-group">
      <input type="email" id="loginEmail" placeholder="Email" required>
    </div>

    <div class="form-group">
      <input type="password" id="loginPassword" placeholder="Password" required>
    </div>

    <button type="button" onclick="loginUser()" class="auth-btn">
      Login
    </button>

  </form>

  <p class="auth-footer">
    Don’t have an account? <a href="signup.html">Sign up</a>
  </p>

</div>
   <script>

      if (localStorage.getItem("parentalConsent") !== "true") {
    window.location.replace("consent.html"); // consent page
  }

  // ======================== HIGHLIGHT: loginUser() ========================
  function loginUser() {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value.trim();


  const savedEmail = localStorage.getItem("userEmail");
  const savedPassword = localStorage.getItem("userPassword");
  const savedName = localStorage.getItem("fullName");

  if (email === savedEmail && password === savedPassword) {

    // Save active user session
    localStorage.setItem("loggedInUser", email);
    localStorage.setItem("loggedInName", savedName);

    // Consent check
    const consent = localStorage.getItem("parentalConsent");

    if (consent !== "true") {
      window.location.href = "consent.html";
    } else {
      window.location.href = "dashboard.html";
    }

  } else {
    alert("Invalid email or password.");
  }
}
// ====================== END HIGHLIGHT: loginUser() ======================
</script>
</body>
</html>
